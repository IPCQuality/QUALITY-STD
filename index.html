<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pencari Format Produk</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-3xl mx-auto space-y-6">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-blue-600">Pencari Format Produk</h1>
                <p class="text-sm text-slate-500">Pencarian berdasarkan database aktual dengan VLOOKUP</p>
            </div>
            <div class="bg-blue-50 text-blue-800 px-4 py-3 rounded-lg text-sm font-medium border border-blue-100 text-center md:text-right">
                <div id="clockDisplay" class="text-lg font-bold">00:00:00</div>
                <div id="dateDisplay">Memuat tanggal...</div>
                <div id="shiftDisplay" class="mt-1 inline-block bg-blue-600 text-white px-2 py-0.5 rounded text-xs">Shift -</div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <form id="searchForm" class="flex flex-col md:flex-row gap-4">
                <div class="flex-1">
                    <label class="block text-sm font-semibold text-slate-700 mb-1">MID Varian <span class="text-red-500">*</span></label>
                    <input type="number" id="mid" required placeholder="Contoh: 62984" 
                        class="w-full px-4 py-2 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="flex-1">
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Mesin / Line <span class="text-slate-400 font-normal">(Opsional)</span></label>
                    <input type="text" id="mesin" placeholder="Contoh: K1" 
                        class="w-full px-4 py-2 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none uppercase">
                </div>
                <div class="flex items-end">
                    <button type="submit" 
                        class="w-full md:w-auto px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-sm transition-colors">
                        Cari Format
                    </button>
                </div>
            </form>
        </div>

        <div id="resultCard" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="bg-slate-800 text-white px-6 py-4">
                <h2 class="text-xl font-bold" id="resDeskripsi">-</h2>
                <p class="text-slate-300 text-sm mt-1">MID: <span id="resMid" class="font-mono bg-slate-700 px-2 py-0.5 rounded">-</span></p>
            </div>
            
            <div class="p-6 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Format Primer</h3>
                        <div id="resPrimer" class="font-mono text-blue-800 text-lg whitespace-pre-wrap break-words leading-relaxed">-</div>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Format Sekunder</h3>
                        <div id="resSekunder" class="font-mono text-purple-800 text-lg whitespace-pre-wrap break-words leading-relaxed">-</div>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-4 border-t border-slate-100 pt-6">
                    <div id="rcgContainer" class="hidden flex-1 bg-amber-50 p-3 rounded-lg border border-amber-100">
                        <h3 class="text-xs font-bold text-amber-700 uppercase mb-1">Jumlah RCG</h3>
                        <p id="resRcg" class="font-bold text-amber-900 text-lg">-</p>
                    </div>
                    <div class="flex-1 bg-slate-50 p-3 rounded-lg border border-slate-200">
                        <h3 class="text-xs font-bold text-slate-500 uppercase mb-1">Keterangan</h3>
                        <p id="resKeterangan" class="text-slate-800 font-medium">-</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="errorCard" class="hidden bg-red-50 text-red-600 p-4 rounded-lg border border-red-200 text-center font-medium">
            MID tidak ditemukan di database. Pastikan input sudah benar.
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
